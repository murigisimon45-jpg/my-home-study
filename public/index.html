<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MY HOME STUDY</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#6366f1;--shadow:0 4px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:12px}
.btn{padding:12px 18px;border-radius:12px;border:0;font-weight:600;cursor:pointer}.btn-primary{background:var(--primary);color:#fff;width:100%}
.input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--border);margin-top:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;justify-content:center;margin-bottom:10px}
.logo-icon{width:38px;height:38px;background:var(--primary);border-radius:10px;display:grid;place-items:center;color:white}
</style></head><body><div id="app" style="min-height:100vh;display:grid;place-items:center;padding:20px"></div>
<script>
const API_BASE = window.location.origin + '/api';
const LS={get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:(k)=>localStorage.removeItem(k)};
function showToast(m){alert(m)}
let currentUser=LS.get('mhs_user',null);
async function apiFetch(p,m='GET',b=null,auth=true){
 const h={'Content-Type':'application/json'}; if(auth){const t=LS.get('mhs_token'); if(t) h['Authorization']='Bearer '+t;}
 const o={method:m,headers:h}; if(b) o.body=JSON.stringify(b);
 const r=await fetch(API_BASE+p,o); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.msg||'Failed'); return d;
}
function renderLanding(){
 document.getElementById('app').innerHTML=`<div style="max-width:420px;width:100%;text-align:center"><div class="logo"><div class="logo-icon">🏠</div>MY HOME STUDY</div><h1 style="font-size:36px;font-weight:800">MY HOME STUDY</h1><p style="margin:10px 0 20px;color:#64748b">Learn. Practice. Complete.</p><div class="card"><div style="font-size:38px">🚀</div><div style="font-weight:800;margin:10px 0">Welcome!</div><p style="font-size:13px;color:#64748b;margin-bottom:20px">One place for students and teachers.</p><button class="btn btn-primary" onclick="showRole()">Get Started — Sign Up / Log In</button><div style="margin-top:12px;font-size:11px;color:#64748b">Students need Teacher ID • Teachers get Teacher ID</div></div><div id="status" style="margin-top:12px;font-size:12px;color:#10b981"></div></div>`;
 checkAPI();
}
function showRole(){
 document.getElementById('app').innerHTML+=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px" onclick="if(event.target===this)this.remove()"><div class="card" style="max-width:360px;width:100%"><h3>Continue as...</h3><button class="btn btn-primary" style="margin-top:12px" onclick="renderAuth('student')">👩🎓 I am a Student</button><button class="btn btn-primary" style="margin-top:8px;background:#f59e0b" onclick="renderAuth('teacher')">👨🏫 I am a Teacher</button><button class="btn" style="width:100%;margin-top:8px;background:#f1f5f9" onclick="this.closest('div').parentElement.remove()">Cancel</button></div></div>`;
}
function renderAuth(role){
 if(role==='student') renderStudentAuth(); else renderTeacherAuth();
}
function renderStudentAuth(){
 document.getElementById('app').innerHTML=`<div style="max-width:420px;width:100%"><div class="logo"><div class="logo-icon">🏠</div>MY HOME STUDY</div><div class="card"><h2>Student Portal</h2><button class="btn btn-primary" style="margin-top:12px" onclick="renderRegStudent()">Create Student Account</button><button class="btn" style="width:100%;margin-top:8px;background:#fff;border:1px solid #e2e8f0" onclick="renderLogin()">Log In</button><button class="btn" style="width:100%;margin-top:8px;background:#f1f5f9" onclick="renderLanding()">← Back</button></div></div>`;
}
function renderTeacherAuth(){
 document.getElementById('app').innerHTML=`<div style="max-width:420px;width:100%"><div class="logo"><div class="logo-icon">🏠</div>MY HOME STUDY</div><div class="card"><h2>Teacher Portal</h2><button class="btn btn-primary" style="margin-top:12px" onclick="renderRegTeacher()">Create Teacher Account</button><button class="btn" style="width:100%;margin-top:8px;background:#fff;border:1px solid #e2e8f0" onclick="renderLogin()">Log In</button><button class="btn" style="width:100%;margin-top:8px;background:#f1f5f9" onclick="renderLanding()">← Back</button></div></div>`;
}
function renderLogin(){
 document.getElementById('app').innerHTML=`<div style="max-width:420px;width:100%"><div class="card"><h2>Log in</h2><input class="input" id="le" placeholder="Email"><input class="input" id="lp" type="password" placeholder="Password" style="margin-top:10px"><div id="err" style="color:red;font-size:12px;margin-top:8px"></div><button class="btn btn-primary" style="margin-top:12px" onclick="doLogin()">Log In</button><button class="btn" style="width:100%;margin-top:8px;background:#f1f5f9" onclick="renderLanding()">Back</button></div></div>`;
}
async function doLogin(){
 try{
  const email=document.getElementById('le').value, pass=document.getElementById('lp').value;
  const d=await apiFetch('/auth/login','POST',{email,password:pass},false);
  LS.set('mhs_token',d.token); LS.set('mhs_user',d.user); currentUser=d.user;
  showToast('Login ok'); renderDashboard();
 }catch(e){document.getElementById('err').innerText=e.message}
}
function renderRegTeacher(){
 document.getElementById('app').innerHTML=`<div style="max-width:420px;width:100%"><div class="card"><h2>Create Teacher</h2><input class="input" id="tf" placeholder="Full name"><input class="input" id="ts" placeholder="School" style="margin-top:8px"><input class="input" id="tw" placeholder="WhatsApp 07..." style="margin-top:8px"><input class="input" id="te" placeholder="Email" style="margin-top:8px"><input class="input" id="tp" type="password" placeholder="Password" style="margin-top:8px"><div id="err" style="color:red;font-size:12px;margin-top:8px"></div><button class="btn btn-primary" style="margin-top:12px" onclick="doRegTeacher()">Create</button><button class="btn" style="width:100%;margin-top:8px;background:#f1f5f9" onclick="renderLanding()">Back</button></div></div>`;
}
async function doRegTeacher(){
 try{
  const data={fullName:document.getElementById('tf').value,school:document.getElementById('ts').value,whatsapp:document.getElementById('tw').value,email:document.getElementById('te').value,password:document.getElementById('tp').value};
  const d=await apiFetch('/auth/register/teacher','POST',data,false);
  LS.set('mhs_token',d.token); LS.set('mhs_user',d.user);
  document.getElementById('app').innerHTML=`<div style="max-width:420px;width:100%"><div class="card" style="text-align:center"><div style="font-size:40px">🎉</div><h2>YOUR TEACHER ID</h2><div style="font-size:32px;font-weight:800;color:#6366f1">${d.user.teacherId}</div><p style="font-size:12px;color:#64748b;margin-top:10px">Share this with students</p><button class="btn btn-primary" style="margin-top:12px" onclick="location.reload()">Go to Dashboard</button></div></div>`;
 }catch(e){document.getElementById('err').innerText=e.message}
}
function renderRegStudent(){
 document.getElementById('app').innerHTML=`<div style="max-width:420px;width:100%"><div class="card"><h2>Create Student</h2><input class="input" id="sf" placeholder="First name"><input class="input" id="sl" placeholder="Last name" style="margin-top:8px"><select class="input" id="sg" style="margin-top:8px"><option>Grade 8</option><option>Grade 9</option></select><input class="input" id="st" placeholder="Teacher ID TCH-XXX" style="margin-top:8px"><input class="input" id="se" placeholder="Email" style="margin-top:8px"><input class="input" id="sp" type="password" placeholder="Password" style="margin-top:8px"><div id="err" style="color:red;font-size:12px;margin-top:8px"></div><button class="btn btn-primary" style="margin-top:12px" onclick="doRegStudent()">Create</button><button class="btn" style="width:100%;margin-top:8px;background:#f1f5f9" onclick="renderLanding()">Back</button></div></div>`;
}
async function doRegStudent(){
 try{
  const data={firstName:document.getElementById('sf').value,lastName:document.getElementById('sl').value,grade:document.getElementById('sg').value,teacherId:document.getElementById('st').value,email:document.getElementById('se').value,password:document.getElementById('sp').value};
  const d=await apiFetch('/auth/register/student','POST',data,false);
  LS.set('mhs_token',d.token); LS.set('mhs_user',d.user); location.reload();
 }catch(e){document.getElementById('err').innerText=e.message}
}
function renderDashboard(){
 const u=LS.get('mhs_user'); if(!u) return renderLanding();
 document.getElementById('app').innerHTML=`<div style="max-width:600px;width:100%"><div class="card"><h2>Welcome ${u.fullName||u.firstName} 👋</h2><p style="font-size:12px;color:#64748b">Role: ${u.role} • ID: ${u.teacherId||''}</p><div style="margin-top:16px;padding:12px;background:#f0fdf4;border-radius:12px"><b>✅ Your site is working!</b><br><span style="font-size:12px">Backend connected to MongoDB</span></div><button class="btn" style="width:100%;margin-top:16px;background:#f1f5f9" onclick="localStorage.clear();location.reload()">Logout</button></div><div class="card" style="margin-top:12px"><h3>Next Steps</h3><ul style="font-size:13px;margin-top:8px;padding-left:18px"><li>Teacher: Create assignments via /api/assignments POST</li><li>Student: View assignments</li><li>Full curriculum UI is in original file - this is minimal working version</li></ul></div></div>`;
}
async function checkAPI(){
 try{const d=await fetch(API_BASE+'/health').then(r=>r.json()); document.getElementById('status').innerText='✅ API: '+d.status+' • MongoDB: '+(d.mongo||'connected');}catch{ document.getElementById('status').innerText='⏳ Waking up API... refresh in 10s';}
}
(function(){const u=LS.get('mhs_user'); if(u) renderDashboard(); else renderLanding();})();
</script></body></html>
