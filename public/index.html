<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>MY HOME STUDY - Multi Device</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#6366f1;--primary2:#818cf8;--accent:#f1f5f9;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--shadow:0 4px 24px rgba(0,0,0,.06)}
html,body{overflow-x:hidden;max-width:100vw;-webkit-tap-highlight-color:transparent}
.modal{max-width:92vw}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
button{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.btn{padding:12px 18px;border-radius:12px;border:0;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;min-height:44px}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:var(--accent);color:var(--text)}
.btn-outline{border:1.5px solid var(--border);background:transparent;color:var(--text)}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--text);outline:0;margin-top:4px;font-size:16px}
.badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;background:var(--accent)}
.progress-track{height:8px;background:var(--accent);border-radius:999px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .6s}
.sidebar{width:260px;min-height:100vh;background:var(--card);border-right:1px solid var(--border);position:fixed;left:0;top:0;padding:20px;display:flex;flex-direction:column;gap:12px;z-index:20}
.main{margin-left:260px;min-height:100vh;padding:24px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:none;grid-template-columns:repeat(4,1fr);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30;backdrop-filter:blur(12px)}
.bottom-nav button{flex-direction:column;font-size:10px;gap:2px;padding:8px 4px;background:transparent;border:0;color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:10px;margin:0 2px}
.bottom-nav button.active{background:var(--accent);color:var(--primary);font-weight:700}
.bottom-nav button.logout-btn{color:var(--danger);background:#fef2f2}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:16px;padding-bottom:100px}.bottom-nav{display:grid}}
.logo{display:flex;align-items:center;gap:10;font-weight:800;font-size:20px}
.logo-icon{width:38px;height:38px;background:var(--primary);border-radius:10px;display:grid;place-items:center;color:white}
.grid-subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--card);border-radius:20px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:80px;right:16px;left:16px;background:var(--text);color:white;border:0;padding:14px 18px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:9999;max-width:360px;display:none;margin:0 auto;text-align:center;font-weight:600}
@media(min-width:900px){.toast{left:auto;right:20px;bottom:20px}}
</style>
</head>

<script>
// CLEAN FULL VERSION - No duplicates, mobile logout optimized
const API_BASE = localStorage.getItem('mhs_api_base') || (window.location.origin + '/api');
const USE_BACKEND = true;
const LS = {
 get:(k,d=null)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch{ return d } },
 set:(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} },
 del:(k)=>{ try{ localStorage.removeItem(k) }catch{} }
};
function getToken(){ return LS.get('mhs_token', null); }
function setToken(t){ LS.set('mhs_token', t); }
function getUserCache(){ return LS.get('mhs_user', null); }
function setUserCache(u){ LS.set('mhs_user', u); }
async function apiFetch(path, method='GET', body=null, needAuth=true){
 const headers = {'Content-Type':'application/json'};
 if(needAuth){ const token = getToken(); if(token) headers['Authorization'] = 'Bearer '+token; }
 const opts = {method, headers};
 if(body) opts.body = JSON.stringify(body);
 const res = await fetch(API_BASE+path, opts);
 const data = await res.json().catch(()=>({}));
 if(!res.ok) throw new Error(data.msg || 'Request failed');
 return data;
}
let cache = {assignments:[], submissions:[], studentsProgress:[], completions:[], practiceScores:[], concepts:{}};
async function loadBackendData(){
 if(!USE_BACKEND || !getToken()) return;
 try{
   const [assigns, subs] = await Promise.all([
     apiFetch('/assignments','GET',null,true),
     apiFetch('/submissions','GET',null,true)
   ]);
   cache.assignments = assigns;
   cache.submissions = subs;
   if(currentUser && currentUser.role==='teacher'){
     try{ const prog = await apiFetch('/progress/teacher/students','GET',null,true); cache.studentsProgress = prog; }catch(e){}
   }
   if(currentUser && currentUser.role==='student'){
     try{
       const [comps, pract] = await Promise.all([
         apiFetch('/progress/completions','GET',null,true),
         apiFetch('/progress/practice','GET',null,true)
       ]);
       cache.completions = comps;
       cache.practiceScores = pract;
     }catch(e){}
   }
 }catch(e){
   console.warn('Backend load failed', e.message);
   cache.assignments = LS.get('mhs_assignments',[]);
   cache.submissions = LS.get('mhs_submissions',[]);
   cache.completions = LS.get('mhs_topicCompletions',[]).filter(c=>c.studentId===currentUser?.id);
   cache.practiceScores = LS.get('mhs_practiceScores',[]).filter(p=>p.studentId===currentUser?.id);
 }
}
function showToast(msg){
 let t=document.getElementById('toast');
 if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
 t.innerText='✅ '+msg; t.style.display='block';
 setTimeout(()=>t.style.display='none', 3000);
}
function getReqs(pwd){
 const p=pwd||'';
 return [
  {label:'8+ chars', met: p.length>=8},
  {label:'Uppercase A-Z', met:/[A-Z]/.test(p)},
  {label:'Lowercase a-z', met:/[a-z]/.test(p)},
  {label:'Number 0-9', met:/[0-9]/.test(p)},
  {label:'Special !@#$', met:/[^A-Za-z0-9]/.test(p)}
 ];
}
function isStrongPassword(p){ return getReqs(p).every(r=>r.met); }
function logout(){
 if(!confirm('Log out? Your progress is saved in cloud.')) return;
 LS.del('mhs_token');
 LS.del('mhs_user');
 LS.del('mhs_session');
 currentUser=null;
 currentPage='landing';
 currentSubPage='home';
 showToast('Logged out');
 render();
}

function getTimeGreeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 18) return 'Good afternoon';
  return 'Good evening';
}
function getRealTimeString(){
  return new Date().toLocaleTimeString('en-KE', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true});
}
function getRealDateString(){
  return new Date().toLocaleDateString('en-KE', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
let clockInterval=null;
function startClock(){
  if(clockInterval) clearInterval(clockInterval);
  const update = ()=>{
    const el = document.getElementById('live_clock');
    const el2 = document.getElementById('live_clock_mobile');
    const str = getRealTimeString() + ' • ' + getRealDateString();
    if(el) el.innerText = str;
    if(el2) el2.innerText = getRealTimeString();
  };
  update();
  clockInterval = setInterval(update, 1000);
}
function getTeacherStudentsForDisplay(){
  if(typeof USE_BACKEND !== 'undefined' && USE_BACKEND && typeof cache !== 'undefined' && cache.studentsProgress && cache.studentsProgress.length){
    return cache.studentsProgress.map(p=>({
      ...p.student,
      id: p.student._id || p.student.id,
      _id: p.student._id,
      completions: p.completions,
      practicesCount: p.practicesCount,
      avgPractice: p.avgPractice,
      firstName: p.student.firstName,
      lastName: p.student.lastName,
      grade: p.student.grade,
      email: p.student.email
    }));
  }
  const usersLocal=LS.get('mhs_users',[]);
  const localStudents = usersLocal.filter(u=>u.role==='student'&&u.teacherId===currentUser.teacherId).map(u=>({...u, completions:0, avgPractice:0}));
  if(localStudents.length) return localStudents;
  if(typeof USE_BACKEND !== 'undefined' && USE_BACKEND && typeof cache !== 'undefined' && cache.submissions && cache.submissions.length){
    const seen={};
    cache.submissions.forEach(s=>{
      const stu = s.studentId;
      if(stu && stu._id && !seen[stu._id]){
        seen[stu._id]= {...stu, id: stu._id, _id: stu._id, completions:0, avgPractice:0, firstName: stu.firstName, lastName: stu.lastName, grade: stu.grade, email: stu.email};
      } else if(stu && typeof stu === 'object' && stu.firstName){
        const key = stu._id || stu.email;
        if(key && !seen[key]) seen[key]= {...stu, id: stu._id || key, _id: stu._id, completions:0, avgPractice:0};
      }
    });
    const fromSubs = Object.values(seen);
    if(fromSubs.length) return fromSubs;
  }
  return [];
}

async function doLogin(){
 const email=document.getElementById('login_email').value.trim();
 const pass=document.getElementById('login_pass').value;
 const err=document.getElementById('login_err');
 if(!email||!pass){ err.style.display='block'; err.innerText='Enter email and password'; return; }
 err.style.display='none';
 try{
   if(USE_BACKEND){
     const data = await apiFetch('/auth/login','POST',{email,password:pass}, false);
     setToken(data.token);
     setUserCache(data.user);
     let u = data.user;
     currentUser = {...u, id: u._id || u.id};
     currentPage = u.role==='student' ? 'student' : 'teacher';
     currentSubPage='home';
     await loadBackendData();
     showToast('Login successful');
     render();
   } else {
     const users=LS.get('mhs_users',[]);
     const u=users.find(x=>x.email.toLowerCase()===email.toLowerCase());
     if(!u){err.style.display='block';err.innerText='Account not found.';return}
     if(u.password!==pass){err.style.display='block';err.innerText='Incorrect email or password.';return}
     LS.set('mhs_session',{id:u.id,email:u.email,role:u.role});
     currentUser=u;
     currentPage=u.role==='student'?'student':'teacher';
     currentSubPage='home';
     showToast('Login successful');
     render();
   }
 }catch(e){
   err.style.display='block';
   err.innerText=e.message || 'Login failed';
 }
}

function updateStrength(pwd){
 const reqs=getReqs(pwd);
 const met=reqs.filter(r=>r.met).length;
 let label=""; let color="var(--border)"; let width="0%";
 if(!pwd){label=""; width="0%";}
 else if(met<=2){label="Weak"; color="#ef4444"; width="25%";}
 else if(met===3){label="Fair"; color="#f59e0b"; width="50%";}
 else if(met===4){label="Strong"; color="#0ea5e9"; width="75%";}
 else {label="Very Strong"; color="#10b981"; width="100%";}
 const el=document.getElementById('fp_strength');
 if(!el) return;
 el.innerHTML='<div class="progress-track" style="height:6px;margin-top:8px"><div class="progress-fill" style="width:'+width+';background:'+color+'"></div></div><div style="font-size:11px;margin-top:6px;display:flex;justify-content:space-between"><span style="color:'+color+';font-weight:700;font-size:12px">'+label+'</span><span style="color:var(--muted);font-size:10px">'+met+'/5 requirements</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px">'+reqs.map(r=>'<div style="font-size:10px;display:flex;gap:5px;align-items:center;color:'+(r.met?'var(--success)':'var(--muted)')+';font-weight:'+(r.met?600:400)+'"><span style="width:14px;height:14px;border-radius:999px;background:'+(r.met?'var(--success)':'var(--accent)')+';color:'+(r.met?'white':'var(--muted)')+';display:grid;place-items:center;font-size:9px">'+(r.met?'✓':'✗')+'</span>'+r.label+'</div>').join('')+'</div>';
}


async function doReset(id){
 const actualId = window._resetId || id;
 const np=document.getElementById('fp_npass').value;
 const ncp=document.getElementById('fp_cpass').value;
 const err=document.getElementById('fp_err2');
 if(!isStrongPassword(np)){err.style.display='block';err.innerText='Password must meet all 5 strong requirements';return}
 if(np!==ncp){err.style.display='block';err.innerText='Passwords do not match';return}
 try{
   if(USE_BACKEND){
     await apiFetch('/auth/forgot/reset','POST',{id:actualId,newPassword:np}, false);
     showToast('Password reset successful! Please login');
     currentPage='login'; render();
   } else {
     const users=LS.get('mhs_users',[]);
     const updated=users.map(u=>u.id===id?{...u,password:np}:u);
     LS.set('mhs_users',updated);
     showToast('Password reset successful! Please login');
     currentPage='login'; render();
   }
 }catch(e){ err.style.display='block'; err.innerText=e.message; }
}

async function doStudentReg(){
 const first=document.getElementById('reg_first').value.trim();
 const last=document.getElementById('reg_last').value.trim();
 const middle=document.getElementById('reg_middle').value.trim();
 const grade=document.getElementById('reg_grade').value;
 const tid=document.getElementById('reg_tid').value.toUpperCase().trim();
 const email=document.getElementById('reg_email').value.trim();
 const pass=document.getElementById('reg_pass').value;
 const cpass=document.getElementById('reg_cpass').value;
 const err=document.getElementById('reg_err');
 function showE(msg){err.style.display='block';err.innerText=msg;}
 if(!first||!last||!grade||!tid||!email||!pass||!cpass){showE('Please complete all required fields');return}
 if(!/^TCH-\d{3}$/.test(tid)){showE('Teacher ID must be TCH-XXX');return}
 if(!isStrongPassword(pass)){showE('Password must be strong');return}
 if(pass!==cpass){showE('Passwords do not match');return}
 try{
   if(USE_BACKEND){
     const data = await apiFetch('/auth/register/student','POST',{firstName:first, lastName:last, middleName:middle, grade, teacherId:tid, email, password:pass}, false);
     setToken(data.token);
     setUserCache(data.user);
     currentUser = {...data.user, id: data.user.id||data.user._id, firstName:first, lastName:last, grade, teacherId:tid};
     currentPage='student'; currentSubPage='home';
     await loadBackendData();
     showToast('Account created!');
     render();
   } else {
     const users=LS.get('mhs_users',[]);
     const teacher=users.find(u=>u.role==='teacher'&&u.teacherId===tid);
     if(!teacher){showE('Teacher ID not found');return}
     if(users.some(u=>u.email.toLowerCase()===email.toLowerCase())){showE('Email already registered');return}
     const newUser={id:'stu_'+Date.now(),role:'student',firstName:first,middleName:middle,lastName:last,grade:grade,teacherId:tid,teacherName:teacher.fullName,email:email,password:pass,createdAt:new Date().toISOString()};
     users.push(newUser); LS.set('mhs_users',users);
     LS.set('mhs_session',{id:newUser.id,email:email,role:'student'});
     currentUser=newUser; currentPage='student'; currentSubPage='home';
     showToast('Account created!'); render();
   }
 }catch(e){ showE(e.message); }
}

async function doTeacherReg(){
 const full=document.getElementById('t_full').value.trim();
 const school=document.getElementById('t_school').value.trim();
 const phone=document.getElementById('t_phone').value.trim();
 const wa=document.getElementById('t_wa').value.trim();
 const email=document.getElementById('t_email').value.trim();
 const pass=document.getElementById('t_pass').value;
 const cpass=document.getElementById('t_cpass').value;
 const err=document.getElementById('t_err');
 function showE(msg){err.style.display='block';err.innerText=msg;}
 if(!full||!school||!wa||!email||!pass||!cpass){showE('Please complete all required fields');return}
 if(!/^(\+254|0)(7|1)\d{8}$/.test(wa.trim())){showE('Enter valid Kenyan WhatsApp');return}
 if(!isStrongPassword(pass)){showE('Password must be strong');return}
 if(pass!==cpass){showE('Passwords do not match');return}
 try{
   if(USE_BACKEND){

function startAssignment(id){
 const assignments=(USE_BACKEND ? cache.assignments : LS.get('mhs_assignments',[]));
 const submissions=(USE_BACKEND ? cache.submissions : LS.get('mhs_submissions',[]));
 let sub=submissions.find(s=> (s.assignmentId===id || s.assignmentId?._id===id || (s.assignmentId && s.assignmentId._id===id) ) && (s.studentId===currentUser.id || s.studentId?._id===currentUser.id || s.studentId===currentUser._id || (s.studentId && s.studentId._id===currentUser.id) ));
 if(sub && sub.status==='Submitted'){
  showToast('🔒 Already submitted - cannot edit until teacher grades');
  selAssign=id;
  renderAssignmentDetail();
  return;
 }
 if(sub && sub.status==='Graded'){
  selAssign=id;
  renderAssignmentDetail();
  return;
 }
 const ass=assignments.find(a=>a._id===id || a.id===id);
 if(!ass){
   showToast('Assignment not found');
   return;
 }
 if(!sub && !USE_BACKEND){
  sub={id:'sub_'+Date.now(),assignmentId:id,studentId:currentUser.id,answers:[],status:'In Progress',score:0,submittedAt:new Date().toISOString()};
  submissions.push(sub);
  LS.set('mhs_submissions',submissions);
 }
 selAssign=id;
 currentSubPage='assignmentDetail';
 renderAssignmentDetail();
}

function renderPractice(){
 const grade=currentUser.grade||'Grade 8';
 const curriculum=CURRICULUM[grade]||{};
 const subj=selSubject;
 const topicId=selTopic;
 let topic=null;
 for(let s of curriculum[subj]||[]){let t=s.topics.find(x=>x.id===topicId); if(t){topic=t; break;}}
 if(!topic) return;
 practiceState.tab='practice';
 renderTopicDetail();
}

function saveTeacherProfile(){
 const full=document.getElementById('prof_full').value;
 const school=document.getElementById('prof_school').value;
 const phone=document.getElementById('prof_phone').value;
 const wa=document.getElementById('prof_wa').value;
 const email=document.getElementById('prof_email').value;
 if(!wa||!/^(\+254|0)(7|1)\d{8}$/.test(wa.trim())){showToast('Valid WhatsApp required');return}
 let users=LS.get('mhs_users',[]);
 users=users.map(u=>u.id===currentUser.id?{...u, fullName:full, school:school, phone:phone, whatsapp:wa, email:email}:u);
 LS.set('mhs_users',users);
 currentUser={...currentUser, fullName:full, school:school, phone:phone, whatsapp:wa, email:email};
 showToast('Profile updated');
 renderTeacher();
}
// Init
(function(){
 const sess=LS.get('mhs_session',null);
 if(sess){
  const users=LS.get('mhs_users',[]);
  const u=users.find(x=>x.id===sess.id);
  if(u){currentUser=u; currentPage=u.role==='student'?'student':'teacher';}
 }
 render();
})();


async function createAssignment(){
 const title=document.getElementById('ass_title').value.trim();
 const subject=document.getElementById('ass_subject').value;
 const grade=document.getElementById('ass_grade').value;
 const desc=document.getElementById('ass_desc').value;
 const marks=parseInt(document.getElementById('ass_marks').value)||20;
 const due=document.getElementById('ass_due').value;
 const qs=document.getElementById('ass_questions').value;
 if(!title){showToast('Title required');return}
 const questions=qs.split('\n').filter(l=>l.trim()).map((line,i)=>{const parts=line.split('|'); return {id:'q_'+Date.now()+'_'+i, text:parts[0].trim(), marks:parts[1]?parseInt(parts[1].trim()):5}});
 try{
   if(USE_BACKEND){
     await apiFetch('/assignments','POST',{title,subject,grade,description:desc,totalMarks:marks,dueDate:due,questions}, true);
     document.getElementById('create_modal_backdrop')?.remove();
     showToast('Assignment created!');
     await loadBackendData();
     renderTeacher();
   } else {
     const assignments=(USE_BACKEND ? cache.assignments : LS.get('mhs_assignments',[]));
     const newAss={id:'ass_'+Date.now(),teacherId:currentUser.teacherId,teacherName:currentUser.fullName,title:title,subject:subject,grade:grade,description:desc,totalMarks:marks,dueDate:due,questions:questions,createdAt:new Date().toISOString()};
     assignments.push(newAss);
     LS.set('mhs_assignments',assignments);
     document.getElementById('create_modal_backdrop')?.remove();
     showToast('Assignment created!');
     renderTeacher();
   }
 }catch(e){ showToast(e.message); }
}
async function deleteAssignment(id){
 if(!confirm('Delete assignment?')) return;
 try{
   if(USE_BACKEND){
     await apiFetch('/assignments/'+id,'DELETE',null,true);
     showToast('Deleted');
     await loadBackendData();
     renderTeacher();
   } else {
     let assignments=(USE_BACKEND ? cache.assignments : LS.get('mhs_assignments',[]));
     assignments=assignments.filter(a=>a.id!==id);
     LS.set('mhs_assignments',assignments);
     showToast('Deleted');
     renderTeacher();
   }
 }catch(e){ showToast(e.message); }
}
async function gradeSubmission(subId){
 const submissions = USE_BACKEND ? cache.submissions : (USE_BACKEND ? cache.submissions : LS.get('mhs_submissions',[]));
 const assignments = USE_BACKEND ? cache.assignments : (USE_BACKEND ? cache.assignments : LS.get('mhs_assignments',[]));
 const users = LS.get('mhs_users',[]);
 const sub=submissions.find(s=> (s._id||s.id)===subId);
 const ass=assignments.find(a=> (a._id||a.id)===(sub.assignmentId||sub.assignmentIdStr||sub.assignmentId));
 if(!sub||!ass) return;
 let perQ={};
 ass.questions.forEach(q=>{perQ[q.id]=0});
 if(sub.perQuestion) Object.assign(perQ, sub.perQuestion);
 let total=Object.values(perQ).reduce((a,b)=>a+(parseInt(b)||0),0);
 const answersMap={};
 (sub.answers||[]).forEach(a=>answersMap[a.qId]=a.answer);
 const stuName = sub.studentId?.firstName ? sub.studentId.firstName+' '+(sub.studentId.lastName||'') : 'Student';
 const modalHtml=`
 <div class="modal-backdrop" id="grading_modal_backdrop"><div class="modal" style="max-width:600px;max-height:90vh;overflow:auto">
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-weight:700">Grading: ${stuName}</h3><button class="btn btn-ghost" onclick="document.getElementById('grading_modal_backdrop').remove()">X</button></div>
 <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${ass.title}</div>
 <div style="display:grid;gap:10px" id="grading_qs">
 ${ass.questions.map((q,i)=>`<div style="padding:10px;border:1px solid var(--border);border-radius:10px"><div style="display:flex;justify-content:space-between"><div style="font-weight:600;font-size:12px">Q${i+1}. ${q.text}</div><span style="font-size:10px;background:var(--accent);padding:2px 6px;border-radius:999px">${q.marks}m</span></div><div style="margin-top:6px;background:var(--accent);padding:8px;border-radius:6px;font-size:12px">${answersMap[q.id]||'<em>No answer</em>'}</div><div style="margin-top:6px;display:flex;gap:6px;align-items:center"><span style="font-size:11px">Marks:</span><input class="input" type="number" min="0" max="${q.marks}" style="width:80px" value="${perQ[q.id]}" id="perq_${q.id}" oninput="updateGradingTotal()"></div></div>`).join('')}
 </div>
 <div style="margin-top:12px"><label style="font-size:11px;font-weight:600">Feedback</label><textarea class="input" id="grading_feedback">${sub.feedback||''}</textarea></div>
 <div style="display:flex;justify-content:space-between;margin-top:12px;align-items:center"><div style="font-weight:700;font-size:12px" id="grading_total">Total ${total}</div><button class="btn btn-primary" onclick="submitGrading('${subId}')">Submit Grade</button></div>
 </div></div>
 `;
 document.body.insertAdjacentHTML('beforeend', modalHtml);
}
function updateGradingTotal(){
 const gradingModal=document.getElementById('grading_modal_backdrop');
 if(!gradingModal) return;
 let total=0;
 gradingModal.querySelectorAll('input[id^="perq_"]').forEach(inp=>{total+=parseInt(inp.value)||0});
 const el=document.getElementById('grading_total');
 if(el) el.innerText='Total '+total;
}
async function saveAssignmentProgress(){
 const ass = (USE_BACKEND ? cache.assignments : (USE_BACKEND ? cache.assignments : LS.get('mhs_assignments',[]))).find(a=> (a._id||a.id)===selAssign);
 if(!ass) return;
 let answers=[];
 ass.questions.forEach(q=>{const val=document.getElementById('ans_'+q.id).value; answers.push({qId:q.id, answer:val})});
 try{
   if(USE_BACKEND){
     await apiFetch('/submissions','POST',{assignmentId: ass._id || ass.id, answers, status:'In Progress'}, true);
     showToast('Progress saved');
     await loadBackendData();
   } else {
     const submissions=(USE_BACKEND ? cache.submissions : LS.get('mhs_submissions',[]));
     let sub=submissions.find(s=>s.assignmentId===selAssign && s.studentId===currentUser.id);
     if(sub){sub.answers=answers; sub.status='In Progress';}
     else {sub={id:'sub_'+Date.now(),assignmentId:selAssign,studentId:currentUser.id,answers:answers,status:'In Progress',score:0} ; submissions.push(sub);}
     LS.set('mhs_submissions',submissions);
     showToast('Progress saved');
   }
 }catch(e){ showToast(e.message); }
}
async function submitAssignment(){
 const ass = (USE_BACKEND ? cache.assignments : (USE_BACKEND ? cache.assignments : LS.get('mhs_assignments',[]))).find(a=> (a._id||a.id)===selAssign);
 if(!ass) return;
 let answers=[]; let hasEmpty=false;
 ass.questions.forEach(q=>{const val=document.getElementById('ans_'+q.id).value; if(!val.trim()) hasEmpty=true; answers.push({qId:q.id, answer:val})});
 if(hasEmpty && !confirm('Some answers empty. Submit anyway?')) return;
 try{
   if(USE_BACKEND){
     await apiFetch('/submissions','POST',{assignmentId: ass._id || ass.id, answers, status:'Submitted'}, true);
     showToast('Submitted!');
     currentSubPage='assignments';
     await loadBackendData();
     renderStudent();
   } else {
     const submissions=(USE_BACKEND ? cache.submissions : LS.get('mhs_submissions',[]));
     let sub=submissions.find(s=>s.assignmentId===selAssign && s.studentId===currentUser.id);
     if(sub){sub.answers=answers; sub.status='Submitted';}
     else {sub={id:'sub_'+Date.now(),assignmentId:selAssign,studentId:currentUser.id,answers:answers,status:'Submitted',score:0} ; submissions.push(sub);}
     LS.set('mhs_submissions',submissions);
     showToast('Submitted!');
     currentSubPage='assignments';
     renderStudent();
   }
 }catch(e){ showToast(e.message); }
}
async function submitGrading(subId){
 const gradingModal=document.getElementById('grading_modal_backdrop');
 let perQ={};
 gradingModal.querySelectorAll('input[id^="perq_"]').forEach(inp=>{
  const qId=inp.id.replace('perq_','');
  perQ[qId]=Math.min(parseInt(inp.getAttribute('max')), Math.max(0, parseInt(inp.value)||0));
 });
 const feedback=document.getElementById('grading_feedback').value;
 let total=Object.values(perQ).reduce((a,b)=>a+(parseInt(b)||0),0);
 try{
   if(USE_BACKEND){
     await apiFetch('/submissions/'+subId+'/grade','PUT',{perQuestion:perQ, feedback, score:total}, true);
     document.getElementById('grading_modal_backdrop')?.remove();
     showToast('Graded!');
     await loadBackendData();
     renderTeacher();
   } else {
     const submissions=(USE_BACKEND ? cache.submissions : LS.get('mhs_submissions',[]));
     const sub=submissions.find(s=>s.id===subId);
     const updated={...sub, score:total, perQuestion:perQ, feedback:feedback, gradedAt:new Date().toISOString(), status:'Graded'};
     const newSubs=submissions.map(s=>s.id===subId?updated:s);
     LS.set('mhs_submissions',newSubs);
     document.getElementById('grading_modal_backdrop')?.remove();
     showToast('Graded!');
     renderTeacher();
   }
 }catch(e){ showToast(e.message); }
}
async function toggleConcept(idx){
 try{
   if(USE_BACKEND){
     let doc;
     try{ doc = await apiFetch('/progress/concepts/'+selTopic,'GET',null,true); }catch{ doc={understood:[]}; }
     let understood = doc.understood || [];
     if(understood.includes(idx)) understood=understood.filter(i=>i!==idx);
     else { understood=[...understood, idx]; showToast('Great!'); }
     await apiFetch('/progress/concepts','POST',{topicId:selTopic, understood}, true);
     renderTopicDetail();
   } else {
     let understood=LS.get('mhs_understood_'+currentUser.id+'_'+selTopic,[]);
     if(understood.includes(idx)) understood=understood.filter(i=>i!==idx);
     else {understood=[...understood, idx]; showToast('Great!');}
     LS.set('mhs_understood_'+currentUser.id+'_'+selTopic, understood);
     renderTopicDetail();
   }
 }catch(e){ showToast(e.message); }
}
async function markComplete(){
 try{
   if(USE_BACKEND){
     await apiFetch('/progress/completions','POST',{topicId:selTopic}, true);
     showToast('Topic completed!');
     await loadBackendData();
     renderTopicDetail();
   } else {
     const completions=(USE_BACKEND ? cache.completions : LS.get('mhs_topicCompletions',[]));
     if(!completions.some(c=>c.studentId===currentUser.id&&c.topicId===selTopic)){
       completions.push({studentId:currentUser.id,topicId:selTopic,completedAt:new Date().toISOString()});
       LS.set('mhs_topicCompletions',completions);
       showToast('Topic completed!');
     }
     renderTopicDetail();
   }
 }catch(e){ showToast(e.message); }
}
function submitAnswer(val){
 const grade=currentUser.grade||'Grade 8';
 const subj=selSubject;
 const topicId=selTopic;
 let topic=null;
 for(let s of CURRICULUM[grade][subj]||[]){let t=s.topics.find(x=>x.id===topicId); if(t){topic=t; break;}}
 const q=topic.practice[practiceState.idx];
 let isCorrect=false;
 if(q.type==='mcq') isCorrect=val===q.answer;
 else if(q.type==='tf') isCorrect=val===q.answer;
 else if(q.type==='short') isCorrect=val&&val.toLowerCase().trim()===q.answer.toLowerCase().trim();
 practiceState.answers[practiceState.idx]=val;
 practiceState.answered=true;
 if(isCorrect){
  practiceState.feedback={isCorrect:true, msg:`Correct! ${q.explain}`};
 } else {
  practiceState.feedback={isCorrect:false, msg:`Answer is ${q.answer}. ${q.explain}`};
 }
 if(isCorrect) showToast('Correct!');
 else showToast('Not quite');
 renderTopicDetail();
}
async function nextQuestion(){
 const grade=currentUser.grade||'Grade 8';
 const subj=selSubject;
 const topicId=selTopic;
 let topic=null;
 for(let s of CURRICULUM[grade][subj]||[]){let t=s.topics.find(x=>x.id===topicId); if(t){topic=t; break;}}
 const practiceQs=topic.practice||[];
 if(practiceState.feedback.isCorrect) practiceState.correct++;
 if(practiceState.idx===practiceQs.length-1){
  const pct=Math.round((practiceState.correct/practiceQs.length)*100);
  practiceState.showResult=true;
  practiceState.score=pct;
  try{
    if(USE_BACKEND){
      await apiFetch('/progress/practice','POST',{topicId, score:pct}, true);
      await loadBackendData();
    } else {
      const scores=(USE_BACKEND ? cache.practiceScores : LS.get('mhs_practiceScores',[]));
      scores.push({studentId:currentUser.id,topicId:topicId,score:pct,completedAt:new Date().toISOString()});
      LS.set('mhs_practiceScores',scores);
    }
  }catch(e){}
  showToast(`Score ${pct}%`);
 } else {
  practiceState.idx++;
  practiceState.answered=false;
  practiceState.feedback="";
 }
 renderTopicDetail();
}

 LS.del('mhs_token');
 LS.del('mhs_user');
 LS.del('mhs_session');
 currentUser=null;
 currentPage='landing';
 render();
}
